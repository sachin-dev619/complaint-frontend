<div class="d-flex vh-100">

  <!-- Left -->
  <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-dark text-white">
    <h1>Reset Password</h1>
  </div>

  <!-- Right -->
  <div class="col-md-6 d-flex align-items-center justify-content-center">

    <div class="card p-4 shadow w-75">
      <h3 class="mb-3">Forgot Password</h3>

      <form (ngSubmit)="forgotPassword()">

        <input 
          type="email"
          class="form-control mb-3"
          placeholder="Enter your email"
          [(ngModel)]="email"
          name="email"
          required
        >

        <div *ngIf="message" class="text-success mb-2">
          {{ message }}
        </div>

        <div *ngIf="error" class="text-danger mb-2">
          {{ error }}
        </div>

        <button class="btn btn-dark w-100">Send Reset Link</button>

      </form>

      <p class="mt-3 text-center">
        <a routerLink="/login">Back to Login</a>
      </p>

    </div>

  </div>

</div>
