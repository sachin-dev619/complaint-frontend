<div class="auth-page">

  <div class="auth-brand d-none d-md-flex">
    <h1 class="auth-brand__title">Reset password</h1>
    <p class="auth-brand__tagline">We will email you a link to get back in</p>
  </div>

  <div class="auth-panel">
    <div class="auth-card">

      <h2 class="auth-card__title">Forgot password</h2>
      <p class="text-muted small text-center text-md-start mb-4">Enter the email you use for your account.</p>

      <form (ngSubmit)="forgotPassword()">

        <div class="auth-field">
          <label for="fp-email">Email</label>
          <input
            id="fp-email"
            type="email"
            class="form-control"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div *ngIf="message" class="alert alert-success py-2 small mb-3">
          {{ message }}
        </div>

        <div *ngIf="error" class="alert alert-danger py-2 small mb-3">
          {{ error }}
        </div>

        <button type="submit" class="auth-submit">Send reset link</button>

      </form>

      <div class="auth-back">
        <a routerLink="/login">Back to sign in</a>
      </div>

    </div>
  </div>

</div>
