<div class="d-flex vh-100">

  <!-- Left Side -->
  <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-dark text-white">
    <div class="text-center">
      <h1 class="fw-bold">Complaint System</h1>
      <p class="mt-2">Student First-Time Setup</p>
    </div>
  </div>

  <!-- Right Side -->
  <div class="col-md-6 d-flex align-items-center justify-content-center">

    <div class="card p-4 shadow w-75 rounded-4">
      <h3 class="mb-3 text-center fw-bold">Set Password</h3>

      <form (ngSubmit)="setPassword()" #form="ngForm">

        <!-- Email -->
        <div class="mb-3">
          <input 
            type="email" 
            class="form-control"
            placeholder="Enter your Email"
            [(ngModel)]="data.email"
            name="email"
            required
          >
        </div>

        <!-- Password -->
        <div class="mb-3 position-relative">
          <input 
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            placeholder="Enter Password"
            [(ngModel)]="data.password"
            name="password"
            required
          >
          <span 
            class="position-absolute top-50 end-0 translate-middle-y me-3"
            style="cursor:pointer"
            (click)="showPassword = !showPassword">
            👁️
          </span>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <input 
            type="password"
            class="form-control"
            placeholder="Confirm Password"
            [(ngModel)]="data.confirm_password"
            name="confirm_password"
            required
          >
        </div>

        <!-- Error -->
        <div *ngIf="error" class="alert alert-danger py-1">
          {{ error }}
        </div>

        <!-- Success -->
        <div *ngIf="success" class="alert alert-success py-1">
          {{ success }}
        </div>

        <!-- 🔥 Button -->
        <button 
          *ngIf="!loading" 
          class="btn btn-dark w-100"
          [disabled]="form.invalid"
        >
          Submit
        </button>

        <button *ngIf="loading" class="btn btn-dark w-100" disabled>
  <span class="spinner-border spinner-border-sm"></span> Loading...
</button>

      </form>

      <!-- Links -->
      <div class="mt-3 text-center">
        <a routerLink="/login">Back to Login</a>
      </div>

    </div>

  </div>

</div>
