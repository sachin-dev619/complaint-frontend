<div class="auth-page">

  <div class="auth-brand d-none d-md-flex">
    <h1 class="auth-brand__title">Complaint System</h1>
    <p class="auth-brand__tagline">Student first-time setup</p>
  </div>

  <div class="auth-panel">
    <div class="auth-card">

      <h2 class="auth-card__title">Set your password</h2>
      <p class="text-muted small text-center text-md-start mb-4">Use your student email to activate your account.</p>

      <form (ngSubmit)="setPassword()" #form="ngForm">

        <div class="auth-field">
          <label for="sp-email">Email</label>
          <input
            id="sp-email"
            type="email"
            class="form-control"
            placeholder="you@example.com"
            [(ngModel)]="data.email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="auth-field">
          <label for="sp-password">Password</label>
          <div class="position-relative">
            <input
              id="sp-password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              placeholder="Create a password"
              [(ngModel)]="data.password"
              name="password"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="btn btn-link position-absolute top-50 end-0 translate-middle-y auth-toggle-eye border-0"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="sp-confirm">Confirm password</label>
          <input
            id="sp-confirm"
            type="password"
            class="form-control"
            placeholder="Repeat password"
            [(ngModel)]="data.confirm_password"
            name="confirm_password"
            autocomplete="new-password"
            required
          >
        </div>

        <div *ngIf="error" class="alert alert-danger py-2 small mb-3">
          {{ error }}
        </div>

        <div *ngIf="success" class="alert alert-success py-2 small mb-3">
          {{ success }}
        </div>

        <button
          type="submit"
          *ngIf="!loading"
          class="auth-submit"
          [disabled]="form.invalid">
          Submit
        </button>

        <button *ngIf="loading" type="button" class="auth-submit" disabled>
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Please wait
        </button>

      </form>

      <div class="auth-back">
        <a routerLink="/login">Back to sign in</a>
      </div>

    </div>
  </div>

</div>
