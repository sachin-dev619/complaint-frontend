<div class="d-flex vh-100">

  <!-- Left Side -->
  <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-dark text-white">
    <h1>Complaint System</h1>
  </div>

  <!-- Right Side -->
  <div class="col-md-6 d-flex align-items-center justify-content-center">

    <div class="card p-4 shadow w-75">
      <h3 class="mb-3">Login</h3>

      <form (ngSubmit)="login()">

        <input 
          type="email" 
          class="form-control mb-3" 
          placeholder="Email"
          [(ngModel)]="data.email"
          name="email"
          required
        >

        <input 
          type="password" 
          class="form-control mb-2" 
          placeholder="Password"
          [(ngModel)]="data.password"
          name="password"
          required
        >

        <!-- Forgot Password -->
        <div class="text-end mb-2">
          <a routerLink="/login/forgot-password">Forgot Password?</a>
        </div>

        <button class="btn btn-dark w-100">Login</button>

      </form>

      <!-- Student Register -->
      <p class="mt-3 text-center">
        First time student? 
        <a routerLink="/login/student-register">Set Password</a>
      </p>

    </div>

  </div>

</div>
