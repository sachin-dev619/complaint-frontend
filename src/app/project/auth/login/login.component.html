<div class="login-page">

  <div class="login-brand d-none d-md-flex flex-column text-white">
    <div class="login-brand__inner">
      <div class="login-brand__mark" aria-hidden="true">
        <i class="bi bi-chat-left-text-fill"></i>
      </div>
      <h1 class="login-brand__title">Complaint System</h1>
      <p class="login-brand__tagline">Report and track issues in one place</p>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-card">

      <div class="d-md-none text-center">
        <div class="login-card__badge mx-auto" aria-hidden="true">
          <i class="bi bi-chat-left-text-fill"></i>
        </div>
      </div>

      <h2 class="login-card__title">Welcome back</h2>
      <p class="login-card__subtitle">Sign in to Complaint System</p>

      <div class="login-alert" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="login()" novalidate>

        <div class="login-field">
          <label for="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            class="form-control"
            placeholder="you@example.com"
            [(ngModel)]="data.email"
            name="email"
            autocomplete="email"
            [disabled]="isSubmitting"
            required
          >
        </div>

        <div class="login-field">
          <label for="login-password">Password</label>
          <div class="login-password-wrap">
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              placeholder="Enter your password"
              [(ngModel)]="data.password"
              name="password"
              autocomplete="current-password"
              [disabled]="isSubmitting"
              required
            >
            <button
              type="button"
              class="login-password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="login-forgot">
          <a routerLink="/login/forgot-password" class="login-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Sign in</span>
          <span *ngIf="isSubmitting" class="login-submit__loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Signing in…
          </span>
        </button>

      </form>

      <div class="login-hint">
        <p class="login-hint__text">First time student?</p>
        <a routerLink="/login/student-register" class="login-hint__action">Set up your password</a>
      </div>

    </div>
  </div>

</div>
