<div class="login-page">

  <div class="login-brand d-none d-md-flex flex-column text-white">
    <h1 class="login-brand__title">Complaint System</h1>
    <p class="login-brand__tagline">Report and track issues in one place</p>
  </div>

  <div class="login-panel">
    <div class="login-card">

      <div class="d-md-none text-center">
        <div class="login-card__badge mx-auto" aria-hidden="true">
          <i class="bi bi-chat-left-text-fill"></i>
        </div>
      </div>

      <h2 class="login-card__title">Welcome back</h2>
      <p class="login-card__subtitle">Sign in to Complaint System</p>

      <form (ngSubmit)="login()">

        <div class="login-field">
          <label for="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            class="form-control"
            placeholder="you@example.com"
            [(ngModel)]="data.email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="login-field">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            class="form-control"
            placeholder="Enter your password"
            [(ngModel)]="data.password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="login-forgot">
          <a routerLink="/login/forgot-password" class="login-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-submit">Sign in</button>

      </form>

      <div class="login-hint">
        <p class="login-hint__text">First time student?</p>
        <a routerLink="/login/student-register" class="login-hint__action">Set up your password</a>
      </div>

    </div>
  </div>

</div>
