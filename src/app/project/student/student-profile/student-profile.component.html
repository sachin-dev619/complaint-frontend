<div class="app-page container-fluid px-2 px-sm-3 py-2 py-md-3">

  <div *ngIf="loading" class="text-center text-muted py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 mb-0">Loading profile…</p>
  </div>

  <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

  <div class="card shadow app-panel-card mx-auto profile-shell" *ngIf="user">

    <div class="card-body text-center text-md-start">

      <div class="profile-hero mb-4">
        <div class="profile-avatar mx-auto mx-md-0">
          <i class="bi bi-person-fill"></i>
        </div>
        <div>
          <h2 class="h4 fw-bold mb-1" style="color: #0f172a;">{{ user?.name || 'N/A' }}</h2>
          <p class="text-muted mb-0">{{ user?.email || 'N/A' }}</p>
        </div>
      </div>

      <hr class="my-4 opacity-25">

      <ul class="list-unstyled profile-details mb-0">
        <li class="d-flex align-items-start gap-2 mb-3">
          <i class="bi bi-telephone text-primary mt-1"></i>
          <div>
            <div class="small text-muted">Phone</div>
            <div>{{ user?.phone || 'Not available' }}</div>
          </div>
        </li>
        <li class="d-flex align-items-start gap-2 mb-3" *ngIf="user?.class">
          <i class="bi bi-book text-primary mt-1"></i>
          <div>
            <div class="small text-muted">Class</div>
            <div>{{ user?.class }}</div>
          </div>
        </li>
        <li class="d-flex align-items-start gap-2" *ngIf="user?.division">
          <i class="bi bi-diagram-3 text-primary mt-1"></i>
          <div>
            <div class="small text-muted">Division</div>
            <div>{{ user?.division }}</div>
          </div>
        </li>
      </ul>

      <button type="button" class="btn btn-primary w-100 mt-4" (click)="editProfile()">
        <i class="bi bi-pencil me-1"></i> Edit profile
      </button>

    </div>

  </div>

</div>
