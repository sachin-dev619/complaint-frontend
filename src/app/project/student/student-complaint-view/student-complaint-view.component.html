<div class="app-page container-fluid px-2 px-sm-3 py-2 py-md-3" *ngIf="complaint">

  <div class="card shadow app-panel-card">

    <div class="card-body">

      <h2 class="h5 fw-bold text-center text-md-start mb-4 section-title">Complaint details</h2>

      <div class="row g-3">

        <div class="col-12 col-md-6">
          <label class="form-label small text-muted mb-1">Complaint No</label>
          <input class="form-control" [value]="complaint.complaint_no" readonly>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label small text-muted mb-1">Title</label>
          <input class="form-control" [value]="complaint.title" readonly>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label small text-muted mb-1">Category</label>
          <input class="form-control" [value]="complaint.category?.name" readonly>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label small text-muted mb-1">Subcategory</label>
          <input class="form-control" [value]="complaint.subcategory_id" readonly>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label small text-muted mb-1">Priority</label><br>
          <span class="badge bg-danger" *ngIf="complaint.priority=='High'">High</span>
          <span class="badge bg-warning text-dark" *ngIf="complaint.priority=='Medium'">Medium</span>
          <span class="badge bg-secondary" *ngIf="complaint.priority=='Low'">Low</span>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label small text-muted mb-1">Status</label><br>
          <span class="badge"
            [ngClass]="{
              'bg-warning text-dark': complaint.status=='Pending',
              'bg-info text-dark': complaint.status=='In Progress',
              'bg-success': complaint.status=='Resolved'
            }">
            {{ complaint.status }}
          </span>
        </div>

        <div class="col-12">
          <label class="form-label small text-muted mb-1">Description</label>
          <textarea class="form-control" rows="4" readonly>{{ complaint.complaint_text }}</textarea>
        </div>

        <div class="col-12">
          <label class="form-label small text-muted mb-1">Admin remark</label>
          <textarea class="form-control" rows="3" readonly>{{ complaint.admin_remark || 'No remark yet' }}</textarea>
        </div>

        <div class="col-12">
          <label class="form-label small text-muted mb-1">Attachment</label>
          <img
            *ngIf="complaint.file"
            [src]="storageUrl(complaint.file)"
            class="img-fluid rounded border complaint-img"
            alt="Attachment"
          >
          <p *ngIf="!complaint.file" class="text-muted mb-0">No file uploaded</p>
        </div>

      </div>

      <div class="d-grid d-sm-flex justify-content-sm-center gap-2 mt-4">
        <button type="button" class="btn btn-outline-secondary" routerLink="/student/my-complaints">
          <i class="bi bi-arrow-left me-1"></i> Back to list
        </button>
      </div>

    </div>

  </div>

</div>
