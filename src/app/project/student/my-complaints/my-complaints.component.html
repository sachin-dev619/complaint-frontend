<div class="app-page container-fluid px-2 px-sm-3 py-2 py-md-3">

  <div class="card shadow app-panel-card">
    <div class="card-body">

      <h2 class="h5 fw-bold text-center text-md-start mb-3 section-title">My complaints</h2>

      <div *ngIf="loading" class="text-center text-muted py-4">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        <span class="ms-2">Loading…</span>
      </div>

      <div class="table-responsive rounded border" *ngIf="!loading">

        <table class="table table-sm table-bordered table-hover align-middle text-center mb-0">

          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Complaint No</th>
              <th>Title</th>
              <th>Category</th>
              <th>Status</th>
              <th>Remark</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let c of complaints; let i = index">

              <td>{{ i + 1 }}</td>
              <td class="text-nowrap">{{ c.complaint_no }}</td>
              <td class="text-start">{{ c.title }}</td>
              <td>{{ c.category?.name }}</td>

              <td>
                <span class="badge"
                  [ngClass]="{
                    'bg-warning text-dark': c.status=='Pending',
                    'bg-info text-dark': c.status=='In Progress',
                    'bg-success': c.status=='Resolved'
                  }">
                  {{ c.status }}
                </span>
              </td>

              <td class="text-start small">
                <span [ngClass]="{ 'text-muted': !c.admin_remark }">
                  {{ c.admin_remark || 'No remark' }}
                </span>
              </td>

              <td class="text-nowrap small">{{ c.created_at | date:'short' }}</td>

              <td class="text-nowrap">
                <button type="button" class="btn btn-sm btn-primary me-1 mb-1"
                        (click)="viewComplaint(c.id)">
                  <i class="bi bi-eye"></i><span class="d-none d-sm-inline"> View</span>
                </button>

                <button type="button" class="btn btn-sm btn-warning me-1 mb-1"
                        *ngIf="c.status === 'Pending'"
                        (click)="editComplaint(c.id)">
                  <i class="bi bi-pencil"></i><span class="d-none d-sm-inline"> Edit</span>
                </button>

                <button type="button" class="btn btn-sm btn-outline-secondary mb-1"
                        *ngIf="c.status !== 'Pending'"
                        disabled
                        title="Locked after review">
                  Locked
                </button>
              </td>

            </tr>

            <tr *ngIf="complaints.length === 0">
              <td colspan="8" class="text-center text-muted py-4">
                No complaints found
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>
  </div>

</div>
