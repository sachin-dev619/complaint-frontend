<div class="app-page container-fluid px-2 px-sm-3 py-2 py-md-3">

  <h2 class="h4 fw-bold text-center text-md-start mb-3 mb-md-4" style="color: #0f172a; letter-spacing: -0.02em;">
    Dashboard
  </h2>

  <div class="row g-3 g-md-4 mb-3 mb-md-4">

    <div class="col-6 col-xl-3">
      <div class="card border-0 student-stat-card student-stat-card--total h-100">
        <div class="card-body text-center py-3">
          <div class="student-stat-card__label">Total</div>
          <div class="student-stat-card__value">{{ total }}</div>
        </div>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="card border-0 student-stat-card student-stat-card--pending h-100">
        <div class="card-body text-center py-3">
          <div class="student-stat-card__label">Pending</div>
          <div class="student-stat-card__value">{{ pending }}</div>
        </div>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="card border-0 student-stat-card student-stat-card--progress h-100">
        <div class="card-body text-center py-3">
          <div class="student-stat-card__label">In progress</div>
          <div class="student-stat-card__value">{{ inprogress }}</div>
        </div>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="card border-0 student-stat-card student-stat-card--resolved h-100">
        <div class="card-body text-center py-3">
          <div class="student-stat-card__label">Resolved</div>
          <div class="student-stat-card__value">{{ resolved }}</div>
        </div>
      </div>
    </div>

  </div>

  <div class="row g-3 g-md-4">

    <div class="col-12 col-lg-5">
      <div class="card app-panel-card shadow-sm h-100">
        <div class="card-body">
          <h3 class="h6 fw-semibold mb-3 section-title">Complaint status</h3>
          <div class="chart-wrap mx-auto">
            <canvas baseChart
              [data]="{
                labels: chartLabels,
                datasets: [{ data: chartData }]
              }"
              [type]="'doughnut'">
            </canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-7">
      <div class="card app-panel-card shadow-sm h-100">
        <div class="card-body">
          <h3 class="h6 fw-semibold mb-3 section-title">Recent complaints</h3>

          <div class="table-responsive rounded border">
            <table class="table table-sm table-bordered table-hover align-middle text-center mb-0">
              <thead class="table-dark">
                <tr>
                  <th>#</th>
                  <th>No</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let c of complaints; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td class="text-nowrap">{{ c.complaint_no }}</td>
                  <td class="text-start">{{ c.category?.name }}</td>
                  <td>
                    <span class="badge"
                      [ngClass]="{
                        'bg-warning text-dark': c.status=='Pending',
                        'bg-info text-dark': c.status=='In Progress',
                        'bg-success': c.status=='Resolved'
                      }">
                      {{ c.status }}
                    </span>
                  </td>
                  <td class="text-nowrap small">{{ c.created_at | date:'short' }}</td>
                </tr>
                <tr *ngIf="complaints.length === 0">
                  <td colspan="5" class="text-muted py-4">No complaints yet</td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>

  </div>

</div>
