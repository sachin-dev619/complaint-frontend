<div class="app-page container-fluid px-2 px-sm-3 py-2 py-md-3">
  <div class="card shadow app-panel-card">

    <div class="card-body">

    <h2 class="h5 fw-bold text-center text-md-start mb-4 section-title">Register complaint</h2>

    <form [formGroup]="complaintForm" (ngSubmit)="onSubmit()">

      <div class="row">

        <!-- Title -->
        <div class="col-md-12 mb-3">
          <label>Complaint Title</label>
          <input type="text"
                 formControlName="title"
                 class="form-control"
                 [ngClass]="{'error': isInvalid('title')}"
                 placeholder="Enter title">

          <small *ngIf="isInvalid('title')">
            {{ getErrorMessage('title') }}
          </small>
        </div>

        <!-- Category -->
        <div class="col-md-6 mb-3">
          <label>Category</label>
          <select formControlName="category_id"
                  class="form-select"
                  [ngClass]="{'error': isInvalid('category_id')}"
                  (change)="onCategoryChange()">

            <option value="">Select Category</option>
            <option *ngFor="let c of categories" [value]="c.id">
              {{ c.name }}
            </option>
          </select>

          <small *ngIf="isInvalid('category_id')">
            {{ getErrorMessage('category_id') }}
          </small>
        </div>

        <!-- Subcategory -->
        <div class="col-md-6 mb-3">
          <label>Subcategory</label>
          <select formControlName="subcategory_id"
                  class="form-select"
                  [ngClass]="{'error': isInvalid('subcategory_id')}"
                  [disabled]="!filteredSubcategories.length || loadingSub">

            <option value="">Select Subcategory</option>
            <option *ngIf="loadingSub">Loading...</option>

            <option *ngFor="let s of filteredSubcategories" [value]="s.id">
              {{ s.name }}
            </option>
          </select>

          <small *ngIf="isInvalid('subcategory_id')">
            {{ getErrorMessage('subcategory_id') }}
          </small>
        </div>

        <!-- Priority -->
        <div class="col-md-6 mb-3">
          <label>Priority</label>
          <select formControlName="priority"
                  class="form-select"
                  [ngClass]="{'error': isInvalid('priority')}">

            <option value="">Select Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>

          <small *ngIf="isInvalid('priority')">
            {{ getErrorMessage('priority') }}
          </small>
        </div>

        <!-- File -->
        <div class="col-md-6 mb-3">
          <label>Upload File</label>
          <input type="file" class="form-control" (change)="onFileChange($event)">
        </div>

        <!-- Preview -->
        <div class="col-md-12 mb-3" *ngIf="imagePreview">
          <img [src]="imagePreview" class="img-thumbnail" width="150">
          <button type="button" class="btn btn-sm btn-danger ms-2" (click)="removeFile()">Remove</button>
        </div>

        <!-- Description -->
        <div class="col-md-12 mb-3">
          <label>Description</label>
          <textarea formControlName="complaint_text"
                    class="form-control"
                    [ngClass]="{'error': isInvalid('complaint_text')}"
                    rows="4"
                    placeholder="Write your complaint..."></textarea>

          <small *ngIf="isInvalid('complaint_text')">
            {{ getErrorMessage('complaint_text') }}
          </small>
        </div>

      </div>

      <div class="d-flex flex-column flex-sm-row gap-2 justify-content-sm-end pt-2">
        <button type="button" class="btn btn-outline-secondary order-2 order-sm-1" (click)="resetForm()">
          Reset
        </button>

        <button type="submit" class="btn btn-primary order-1 order-sm-2" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status"></span>
          {{ isSubmitting ? 'Submitting…' : 'Submit complaint' }}
        </button>
      </div>

    </form>

    </div>

  </div>
</div>
