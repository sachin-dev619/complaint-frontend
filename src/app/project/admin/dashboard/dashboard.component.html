<div class="admin-page dashboard-page container-fluid py-3 py-md-4 px-2 px-sm-3">

  <!-- Stat cards -->
  <div class="row g-3 g-md-4 mb-3 mb-md-4">
    <div class="col-12 col-sm-6 col-xl-3" *ngFor="let c of cards">
      <div class="card card-gradient text-white h-100">
        <div class="card-body stat-card-body d-flex align-items-center">

          <div class="icon-circle flex-shrink-0 me-2 me-md-3">
            <i [ngClass]="c.icon"></i>
          </div>

          <div class="min-w-0">
            <h6 class="stat-label mb-1 text-white text-opacity-90">{{ c.title }}</h6>
            <h2 class="stat-value fw-bold mb-0">{{ c.value }}</h2>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row g-3 g-md-4 mb-3 mb-md-4">

    <div class="col-12 col-lg-6">
      <div class="card shadow-sm chart-card">
        <div class="card-body p-2 p-md-3">
          <h6 class="section-title fw-semibold mb-2 mb-md-3">Complaint status overview</h6>

          <div class="chart-box chart-box--status">
            <canvas id="statusChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card shadow-sm chart-card">
        <div class="card-body p-2 p-md-3">
          <h6 class="section-title fw-semibold mb-2 mb-md-3">Monthly complaints</h6>

          <div class="chart-box chart-box--month">
            <canvas id="monthChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Recent complaints -->
  <div class="card shadow-sm recent-card">
    <div class="card-body p-2 p-md-3">
      <h6 class="section-title fw-semibold mb-2 mb-md-3">Recent complaints</h6>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 recent-table">

          <thead class="table-light">
            <tr>
              <th scope="col" class="recent-th-user">User</th>
              <th scope="col" class="recent-th-text">Complaint</th>
              <th scope="col" class="recent-th-status text-nowrap">Status</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let c of complaints | slice:0:5">
              <td class="recent-td-user">{{ c.user.name }}</td>
              <td class="recent-td-text">
                <span class="complaint-preview" [title]="c.complaint_text">{{ c.complaint_text }}</span>
              </td>
              <td class="recent-td-status">
                <span
                  class="badge text-wrap text-start"
                  [ngClass]="{
                    'bg-warning text-dark': c.status == 'Pending',
                    'bg-primary': c.status == 'In Progress',
                    'bg-success': c.status == 'Resolved'
                  }">
                  {{ c.status }}
                </span>
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>
  </div>

</div>
