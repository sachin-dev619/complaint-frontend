<div class="container-fluid py-4">

  <!-- 🔥 CARDS -->
  <div class="row g-4 mb-4">
    <div class="col-md-3" *ngFor="let c of cards">
      <div class="card card-gradient text-white h-100">
        <div class="card-body d-flex align-items-center">

          <div class="icon-circle me-3">
            <i [ngClass]="c.icon"></i>
          </div>

          <div>
            <h6 class="mb-1">{{c.title}}</h6>
            <h2 class="fw-bold mb-0">{{c.value}}</h2>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- 🔥 CHARTS -->
  <div class="row g-4 mb-4">

    <!-- STATUS CHART -->
    <div class="col-md-6">
      <div class="card shadow-sm p-3 chart-card">
        <h6 class="fw-semibold mb-3">📊 Complaint Status Overview</h6>

        <div class="chart-box small-chart">
          <canvas id="statusChart"></canvas>
        </div>
      </div>
    </div>

    <!-- MONTHLY CHART -->
    <div class="col-md-6">
      <div class="card shadow-sm p-3 chart-card">
        <h6 class="fw-semibold mb-3">📅 Monthly Complaints</h6>

        <div class="chart-box small-chart">
          <canvas id="monthChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- 🔥 RECENT COMPLAINTS -->
  <div class="card shadow-sm p-3">
    <h6 class="fw-semibold mb-3">📋 Recent Complaints</h6>

    <div class="table-responsive">
      <table class="table table-hover align-middle">

        <thead class="table-light">
          <tr>
            <th>User</th>
            <th>Complaint</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of complaints | slice:0:5">
            <td>{{c.user.name}}</td>
            <td>{{c.complaint_text}}</td>
            <td>
              <span class="badge"
                [ngClass]="{
                  'bg-warning text-dark': c.status=='Pending',
                  'bg-primary': c.status=='In Progress',
                  'bg-success': c.status=='Resolved'
                }">
                {{c.status}}
              </span>
            </td>
          </tr>
        </tbody>

      </table>
    </div>
  </div>

</div>
