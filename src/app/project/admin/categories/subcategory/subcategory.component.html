<div class="container mt-4">

  <div class="card shadow p-4">

    <h4 class="text-center mb-4">📂 Subcategory Management</h4>

    <!-- FORM -->
    <div class="row mb-3">

      <div class="col-md-4">
        <select class="form-select" [(ngModel)]="category_id">
          <option value="">Select Category</option>
          <option *ngFor="let c of categories" [value]="c.id">
            {{ c.name }}
          </option>
        </select>
      </div>

      <div class="col-md-5">
        <input type="text" class="form-control"
               [(ngModel)]="name"
               placeholder="Enter subcategory">
      </div>

      <div class="col-md-3">
        <button class="btn btn-primary w-100"
                (click)="addSubcategory()">➕ Add</button>
      </div>

    </div>

    <!-- TABLE -->
    <table class="table table-bordered table-hover text-center">

      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Category</th>
          <th>Subcategory</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of subcategories; let i=index">
          <td>{{ (currentPage - 1) * 10 + i + 1 }}</td>
          <td>{{ s.category?.name }}</td>
          <td>{{ s.name }}</td>
          <td>
            <button class="btn btn-danger btn-sm"
                    (click)="deleteSubcategory(s.id)">🗑</button>
          </td>
        </tr>
      </tbody>

    </table>

    <!-- PAGINATION -->
    <div class="d-flex justify-content-between align-items-center mt-2">

      <div>
        Showing {{ (currentPage - 1) * 10 + 1 }}
        to {{ (currentPage - 1) * 10 + subcategories.length }}
        of {{ total }} entries
      </div>

      <ul *ngIf="lastPage > 1" class="pagination mb-0">

        <li class="page-item" [class.disabled]="currentPage===1">
          <button class="page-link" (click)="changePage(currentPage-1)">Prev</button>
        </li>

        <li *ngFor="let p of [].constructor(lastPage); let i=index"
            class="page-item"
            [class.active]="currentPage===i+1">
          <button class="page-link" (click)="changePage(i+1)">
            {{ i+1 }}
          </button>
        </li>

        <li class="page-item" [class.disabled]="currentPage===lastPage">
          <button class="page-link" (click)="changePage(currentPage+1)">Next</button>
        </li>

      </ul>

    </div>

  </div>

</div>
