<div class="admin-page container-fluid px-2 px-sm-3 py-3 py-md-4">

  <div class="card shadow admin-panel-card">

    <div class="card-body">

      <h4 class="text-center mb-3 mb-md-4 fs-5">Subcategory management</h4>

      <div class="row mb-3 g-2 g-md-3">

        <div class="col-12 col-md-4">
          <select class="form-select" [(ngModel)]="category_id">
            <option value="">Select Category</option>
            <option *ngFor="let c of categories" [value]="c.id">
              {{ c.name }}
            </option>
          </select>
        </div>

        <div class="col-12 col-md-5">
          <input type="text" class="form-control"
                 [(ngModel)]="name"
                 placeholder="Enter subcategory">
        </div>

        <div class="col-12 col-md-3">
          <button type="button" class="btn btn-primary w-100 py-2"
                  (click)="addSubcategory()">Add subcategory</button>
        </div>

      </div>

      <div class="table-responsive rounded border">
        <table class="table table-sm table-bordered table-hover align-middle text-center mb-0">

          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Category</th>
              <th>Subcategory</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let s of subcategories; let i=index">
              <td>{{ (currentPage - 1) * 10 + i + 1 }}</td>
              <td class="text-start">{{ s.category?.name }}</td>
              <td class="text-start">{{ s.name }}</td>
              <td>
                <button type="button" class="btn btn-danger btn-sm"
                        (click)="deleteSubcategory(s.id)">Delete</button>
              </td>
            </tr>
          </tbody>

        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 admin-pagination-bar flex-wrap">

        <div class="small text-muted mb-2 mb-md-0">
          Showing {{ (currentPage - 1) * 10 + 1 }}
          to {{ (currentPage - 1) * 10 + subcategories.length }}
          of {{ total }} entries
        </div>

        <ul *ngIf="lastPage > 1" class="pagination mb-0 pagination-sm flex-wrap justify-content-center justify-content-md-end">

          <li class="page-item" [class.disabled]="currentPage===1">
            <button type="button" class="page-link" (click)="changePage(currentPage-1)">Prev</button>
          </li>

          <li *ngFor="let p of [].constructor(lastPage); let i=index"
              class="page-item"
              [class.active]="currentPage===i+1">
            <button type="button" class="page-link" (click)="changePage(i+1)">
              {{ i+1 }}
            </button>
          </li>

          <li class="page-item" [class.disabled]="currentPage===lastPage">
            <button type="button" class="page-link" (click)="changePage(currentPage+1)">Next</button>
          </li>

        </ul>

      </div>

    </div>

  </div>

</div>
