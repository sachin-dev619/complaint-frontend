<div class="admin-page container-fluid px-2 px-sm-3 py-3 py-md-4">

  <div class="page-hero mb-3 mb-md-4">
    <h1 class="page-hero__title">Categories</h1>
    <p class="page-hero__subtitle">Organize complaints by category</p>
  </div>

  <div class="card shadow admin-panel-card">
    <div class="card-body">

      <div class="add-bar row g-2 g-md-3 align-items-stretch mb-3 mb-md-4">
        <div class="col-12 col-md-8">
          <input type="text" class="form-control" [(ngModel)]="name" placeholder="Enter category name" (keyup.enter)="addCategory()">
        </div>
        <div class="col-12 col-md-4">
          <button type="button" class="btn btn-primary w-100 h-100 py-2" (click)="addCategory()">
            <i class="bi bi-plus-lg me-1"></i> Add category
          </button>
        </div>
        <div class="col-12 text-danger small" *ngIf="error?.name">{{ error.name[0] }}</div>
      </div>

      <div class="table-responsive rounded border">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Category name</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of categories; let i = index">
              <td class="text-muted">{{ (currentPage - 1) * 10 + i + 1 }}</td>
              <td class="text-start fw-semibold">
                <span class="cat-icon"><i class="bi bi-tag"></i></span>
                {{ c.name }}
              </td>
              <td class="text-end">
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="deleteCategory(c.id)">
                  <i class="bi bi-trash"></i>
                  <span class="d-none d-sm-inline ms-1">Delete</span>
                </button>
              </td>
            </tr>
            <tr *ngIf="categories.length === 0">
              <td colspan="3" class="text-center text-muted py-5">No categories yet</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 admin-pagination-bar flex-wrap">
        <div class="small text-muted mb-2 mb-md-0">
          Showing {{ (currentPage - 1) * 10 + 1 }}
          to {{ (currentPage - 1) * 10 + categories.length }}
          of {{ total }} entries
        </div>
        <ul *ngIf="lastPage > 1" class="pagination mb-0 pagination-sm flex-wrap justify-content-center justify-content-md-end">
          <li class="page-item" [class.disabled]="currentPage===1">
            <button type="button" class="page-link" (click)="changePage(currentPage-1)">Prev</button>
          </li>
          <li *ngFor="let p of [].constructor(lastPage); let i=index" class="page-item" [class.active]="currentPage===i+1">
            <button type="button" class="page-link" (click)="changePage(i+1)">{{ i+1 }}</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage===lastPage">
            <button type="button" class="page-link" (click)="changePage(currentPage+1)">Next</button>
          </li>
        </ul>
      </div>

    </div>
  </div>
</div>
