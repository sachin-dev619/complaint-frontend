<div class="admin-page container-fluid px-2 px-sm-3 py-3 py-md-4">

  <div class="card shadow admin-panel-card">

    <div class="card-body">

      <h4 class="text-center mb-3 mb-md-4 fs-5">Manage complaints</h4>

      <div class="row mb-3 g-2 g-md-3">

        <div class="col-12 col-lg-4">
          <input
            type="text"
            class="form-control"
            placeholder="Search complaint..."
            [(ngModel)]="searchText"
            (input)="applyFilter()"
          >
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <select
            class="form-select"
            [(ngModel)]="status"
            (change)="applyFilter()"
          >
            <option value="">All Status</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <select
            class="form-select"
            [(ngModel)]="priority"
            (change)="applyFilter()"
          >
            <option value="">All Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>

      </div>

      <div class="table-responsive rounded border">

        <table class="table table-sm table-bordered table-hover align-middle text-center mb-0 complaint-admin-table">

        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>User</th>
            <th>Complaint</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Remark</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let c of filteredData; let i = index">
            <td>{{ (currentPage - 1) * 10 + i + 1 }}</td>

            <td>{{ c.user?.name }}</td>

            <td class="text-start">
              <b>{{ c.title }}</b><br>
              <small class="text-muted">{{ c.complaint_text }}</small>
            </td>

            <!-- Priority -->
            <td>
              <span class="badge bg-danger" *ngIf="c.priority=='High'">High</span>
              <span class="badge bg-warning text-dark" *ngIf="c.priority=='Medium'">Medium</span>
              <span class="badge bg-secondary" *ngIf="c.priority=='Low'">Low</span>
            </td>

            <!-- Status -->
            <td>
              <select
                class="form-select status-dropdown"
                [(ngModel)]="c.status"
                [ngClass]="{
                  'status-pending': c.status=='Pending',
                  'status-progress': c.status=='In Progress',
                  'status-resolved': c.status=='Resolved'
                }"
              >
                <option>Pending</option>
                <option>In Progress</option>
                <option>Resolved</option>
              </select>
            </td>

            <!-- Remark -->
            <td>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="c.admin_remark"
                placeholder="Enter remark"
              >
            </td>

            <td class="text-nowrap">
              <button type="button" class="btn btn-info btn-sm me-1 me-md-2" (click)="viewComplaint(c.id)" title="View">
                View
              </button>

              <button type="button" class="btn btn-success btn-sm" (click)="updateStatus(c)" title="Save">
                Save
              </button>
            </td>
          </tr>

          <tr *ngIf="filteredData.length === 0">
            <td colspan="7">No complaints found</td>
          </tr>

        </tbody>

      </table>

      </div>

      <nav class="mt-3 d-flex justify-content-between align-items-center admin-pagination-bar">

        <div class="small text-muted">
          Showing {{ filteredData.length }} of {{ total }} entries
        </div>

        <ul class="pagination mb-0 pagination-sm flex-wrap justify-content-center justify-content-md-end">

        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="changePage(currentPage - 1)">
            Previous
          </button>
        </li>

        <li
          class="page-item"
          *ngFor="let page of [].constructor(lastPage); let i = index"
          [class.active]="currentPage === (i + 1)"
        >
          <button class="page-link" (click)="changePage(i + 1)">
            {{ i + 1 }}
          </button>
        </li>

        <li class="page-item" [class.disabled]="currentPage === lastPage">
          <button class="page-link" (click)="changePage(currentPage + 1)">
            Next
          </button>
        </li>

        </ul>

      </nav>

    </div>

  </div>

</div>
