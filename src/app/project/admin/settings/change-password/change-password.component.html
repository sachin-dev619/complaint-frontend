<div class="admin-page container-fluid px-2 px-sm-3 py-3 py-md-4">

  <div class="page-card">

    <h4 class="mb-3 text-center fs-5">Change password</h4>

    <form (ngSubmit)="changePassword()">

      <div class="mb-3">
        <label class="form-label">Old Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="form.old_password"
          name="old_password"
          required
          autocomplete="current-password"
        >
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="form.new_password"
          name="new_password"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="form.new_password_confirmation"
          name="new_password_confirmation"
          required
          autocomplete="new-password"
        >
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn btn-danger w-100 py-2" [disabled]="loading">
        {{ loading ? 'Changing...' : 'Change Password' }}
      </button>

    </form>

  </div>

</div>
