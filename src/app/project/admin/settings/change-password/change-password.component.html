<div class="admin-page container-fluid px-2 px-sm-3 py-3 py-md-4">

  <div class="page-hero mb-3 mb-md-4">
    <h1 class="page-hero__title">Change password</h1>
    <p class="page-hero__subtitle">Keep your admin account secure</p>
  </div>

  <div class="card shadow admin-panel-card settings-card">
    <div class="card-body">

      <form (ngSubmit)="changePassword()">
        <div class="mb-3">
          <label class="form-label">Current password</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="form.old_password"
            name="old_password"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="mb-3">
          <label class="form-label">New password</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="form.new_password"
            name="new_password"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="form.new_password_confirmation"
            name="new_password_confirmation"
            required
            autocomplete="new-password"
          >
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loading">
          {{ loading ? 'Updating…' : 'Update password' }}
        </button>
      </form>

    </div>
  </div>
</div>
