<div class="sidebar" [class.mobile-open]="mobileOpen">

  <div class="sidebar-brand">
    <span class="sidebar-brand__icon" aria-hidden="true">
      <i class="bi bi-shield-check"></i>
    </span>
    <div class="sidebar-brand__copy">
      <span class="sidebar-brand__name">Complaint System</span>
      <span class="sidebar-brand__role">Admin panel</span>
    </div>
  </div>

  <p class="menu-label">Menu</p>

  <ul class="menu">

    <li routerLink="/admin/dashboard" routerLinkActive="active">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </li>

    <li routerLink="/admin/complaints" routerLinkActive="active">
      <i class="bi bi-file-earmark-text"></i>
      <span>Complaints</span>
    </li>

    <li (click)="toggleMenu('students')" class="menu-item" [class.open]="openMenu==='students'">
      <div>
        <i class="bi bi-people"></i>
        <span>Students</span>
      </div>
      <i class="bi bi-chevron-down arrow" [class.rotate]="openMenu==='students'"></i>
    </li>

    <li *ngIf="openMenu==='students'" class="submenu">
      <ul>
        <li routerLink="/admin/students-list" routerLinkActive="active">All Students</li>
        <li routerLink="/admin/add-student" routerLinkActive="active">Add Student</li>
      </ul>
    </li>

    <li (click)="toggleMenu('categories')" class="menu-item" [class.open]="openMenu==='categories'">
      <div>
        <i class="bi bi-tags"></i>
        <span>Categories</span>
      </div>
      <i class="bi bi-chevron-down arrow" [class.rotate]="openMenu==='categories'"></i>
    </li>

    <li *ngIf="openMenu==='categories'" class="submenu">
      <ul>
        <li routerLink="/admin/category" routerLinkActive="active">Category</li>
        <li routerLink="/admin/subcategory" routerLinkActive="active">Subcategory</li>
      </ul>
    </li>

    <li (click)="toggleMenu('reports')" class="menu-item" [class.open]="openMenu==='reports'">
      <div>
        <i class="bi bi-graph-up-arrow"></i>
        <span>Reports</span>
      </div>
      <i class="bi bi-chevron-down arrow" [class.rotate]="openMenu==='reports'"></i>
    </li>

    <li *ngIf="openMenu==='reports'" class="submenu">
      <ul>
        <li routerLink="/admin/report/daily" routerLinkActive="active">Daily</li>
        <li routerLink="/admin/report/monthly" routerLinkActive="active">Monthly</li>
      </ul>
    </li>

    <li (click)="toggleMenu('settings')" class="menu-item" [class.open]="openMenu==='settings'">
      <div>
        <i class="bi bi-gear"></i>
        <span>Settings</span>
      </div>
      <i class="bi bi-chevron-down arrow" [class.rotate]="openMenu==='settings'"></i>
    </li>

    <li *ngIf="openMenu==='settings'" class="submenu">
      <ul>
        <li routerLink="/admin/profile" routerLinkActive="active">Profile</li>
        <li routerLink="/admin/change-password" routerLinkActive="active">Change Password</li>
      </ul>
    </li>

  </ul>

</div>
