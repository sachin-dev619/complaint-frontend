<div class="legacy-shell d-flex min-vh-100">

  <aside class="legacy-sidebar">

    <div class="legacy-brand">
      <span class="legacy-brand__icon"><i class="bi bi-lightning-charge-fill"></i></span>
      <span class="legacy-brand__text">Portal</span>
    </div>

    <nav class="legacy-nav nav flex-column">

      <a routerLink="/student/dashboard" class="nav-link" routerLinkActive="active">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>

      <a routerLink="/student/add-complaint" class="nav-link" routerLinkActive="active">
        <i class="bi bi-plus-circle"></i>
        <span>Add complaint</span>
      </a>

      <a routerLink="/student/my-complaints" class="nav-link" routerLinkActive="active">
        <i class="bi bi-collection"></i>
        <span>My complaints</span>
      </a>

      <a routerLink="/complaint/add" class="nav-link" routerLinkActive="active">
        <i class="bi bi-send"></i>
        <span>Quick add</span>
      </a>

      <button type="button" class="btn btn-outline-light mt-4 w-100" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>

    </nav>

  </aside>

  <div class="legacy-content flex-grow-1">
    <router-outlet></router-outlet>
  </div>

</div>
