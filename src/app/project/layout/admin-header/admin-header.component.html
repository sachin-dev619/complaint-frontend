<div class="header d-flex justify-content-between align-items-center shadow-sm bg-white">

  <div class="header-start d-flex align-items-center min-w-0 flex-grow-1">
    <button
      type="button"
      class="btn btn-link text-dark menu-toggle d-lg-none p-2 me-1 border-0 lh-1"
      (click)="toggleSidebar.emit()"
      aria-label="Open navigation menu">
      <i class="bi bi-list fs-3"></i>
    </button>
    <h5 class="header-title mb-0 fw-bold text-dark text-truncate">Admin Panel</h5>
  </div>

  <!-- Right Section -->
  <div class="header-actions d-flex align-items-center position-relative flex-shrink-0">

    <!-- 🔔 Notification Bell -->
    <div class="notification-icon" (click)="toggleNotifications()">

      <!-- ✅ Bell Icon -->
      <i class="fas fa-bell text-dark"></i>

      <!-- 🔴 Badge -->
      <span *ngIf="unreadCount > 0"
            class="badge bg-danger notification-badge">
        {{ unreadCount }}
      </span>
    </div>

    <!-- 🔽 Dropdown -->
    <div class="notification-dropdown shadow-lg"
         *ngIf="showNotifications">

      <!-- Header -->
      <div class="d-flex justify-content-between p-2 border-bottom">
        <b>Notifications</b>
        <small class="text-primary cursor-pointer"
               (click)="markAllRead()">
          Mark all read
        </small>
      </div>

      <!-- List -->
      <div class="notification-list">

        <div *ngFor="let n of notifications"
             class="notification-item p-2 border-bottom"
             [class.unread]="n.is_read == 0"
             (click)="markAsRead(n)">

          <div class="d-flex justify-content-between">
            <b>{{ n.title }}</b>
            <small class="text-muted">
              {{ n.created_at | date:'shortTime' }}
            </small>
          </div>

          <p class="mb-1 text-muted small">
            {{ n.description }}
          </p>

          <small class="text-secondary">
            {{ n.created_at | date:'mediumDate' }}
          </small>
        </div>

        <!-- Empty -->
        <div *ngIf="notifications.length === 0"
             class="p-3 text-center text-muted">
          No notifications
        </div>

      </div>

    </div>

    <button
      type="button"
      class="btn btn-sm btn-danger logout-btn"
      (click)="logout()">
      <i class="bi bi-box-arrow-right d-sm-none"></i>
      <span class="d-none d-sm-inline">Logout</span>
    </button>

  </div>
</div>
