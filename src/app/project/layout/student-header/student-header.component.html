<div class="student-header-bar d-flex justify-content-between align-items-center">

  <div class="header-start d-flex align-items-center min-w-0 flex-grow-1">
    <button
      type="button"
      class="btn btn-link text-dark menu-toggle d-lg-none p-2 me-1 border-0 lh-1"
      (click)="toggleSidebar.emit()"
      aria-label="Open navigation menu">
      <i class="bi bi-list fs-3"></i>
    </button>
    <span class="header-title mb-0 fw-semibold text-truncate">Complaint System</span>
  </div>

  <div class="d-flex align-items-center gap-2 flex-shrink-0">
    <span class="d-none d-md-inline text-muted small header-tag">Student</span>
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="logout()">
      <i class="bi bi-box-arrow-right d-sm-none"></i>
      <span class="d-none d-sm-inline">Logout</span>
    </button>
  </div>

</div>
