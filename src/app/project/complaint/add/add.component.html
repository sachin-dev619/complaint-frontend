<div class="app-page container-fluid px-2 px-sm-3 py-3 py-md-4">

  <div class="card shadow app-panel-card mx-auto complaint-add-card">

    <div class="card-body">

      <h1 class="h5 fw-bold mb-1 section-title text-center text-md-start">Quick complaint</h1>
      <p class="text-muted small mb-4">
        Prefer the full form?
        <a routerLink="/student/add-complaint" class="fw-semibold">Use register complaint</a>
      </p>

      <form (ngSubmit)="submit()">

        <div class="mb-3">
          <label class="form-label" for="qa-category">Category</label>
          <select
            id="qa-category"
            class="form-select"
            [(ngModel)]="data.category_id"
            name="category">
            <option value="">Select</option>
            <option value="1">Faculty</option>
            <option value="2">Student</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label" for="qa-text">Complaint</label>
          <textarea
            id="qa-text"
            class="form-control"
            rows="4"
            [(ngModel)]="data.complaint_text"
            name="complaint"
            placeholder="Describe your issue…"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Submit</button>

      </form>

    </div>

  </div>

</div>
